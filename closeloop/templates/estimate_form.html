{% extends "base.html" %}
{% block title %}Log estimate — {{ app_name }}{% endblock %}
{% block content %}
<section class="section" style="padding-top:1rem;">
  <h2>Log an estimate</h2>
  <p class="sub">After the site visit — capture it once. {{ app_name }} schedules Day 2, 5, and 10 automatically.</p>
  <div class="card card-pad" style="max-width:800px;">
    <form class="form" method="post" action="/estimates">
      <div class="form-row">
        <label>Homeowner name
          <input name="homeowner_name" required placeholder="Paula Nguyen" />
        </label>
        <label>Job / scope title
          <input name="job_title" placeholder="Full tear-off architectural shingles" />
        </label>
      </div>
      <div class="form-row">
        <label>Phone (SMS follow-ups)
          <input name="homeowner_phone" placeholder="+15551234567" />
        </label>
        <label>Email
          <input name="homeowner_email" type="email" placeholder="homeowner@email.com" />
        </label>
      </div>
      <div class="form-row">
        <label>Property address
          <input name="address" placeholder="18 Cedar Lane" />
        </label>
        <label>Estimate amount ($)
          <input name="amount" type="number" step="0.01" min="0" value="0" />
        </label>
      </div>
      <div class="form-row">
        <label>Trade playbook
          <select name="trade_key">
            {% for t in trades %}
            <option value="{{ t.key }}" {% if t.key == business.trade_key %}selected{% endif %}>
              {{ t.emoji }} {{ t.label }}
            </option>
            {% endfor %}
          </select>
        </label>
        <label>Quoted on
          <input name="quoted_on" type="date" value="{{ today }}" />
        </label>
      </div>
      <label>Notes
        <textarea name="notes" placeholder="Insurance claim, prefers weekend start, comparing 2 other bids…"></textarea>
      </label>
      <button class="btn btn-primary" type="submit">Save & schedule follow-ups</button>
    </form>
  </div>
</section>
{% endblock %}
